<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Same-origin requests (the analytics collector among them) carry only the origin, never /C/<hex> or the query (src/lib/analytics.ts). -->
    <meta name="referrer" content="strict-origin" />
    
    <!-- No cache-busting meta tags here: Vercel already serves this page with
         Cache-Control: max-age=0, must-revalidate (and the build's assets are
         hashed), so a new build always loads. The old no-store / Expires 0 tags
         are the one thing this page had that cards X does show (fanfares.io)
         do not, while X showed no card for any onosendai.tech link (2026-11-13). -->
    
    <title>ONOSENDAI V2 — Cyberspace Explorer</title>
    <meta name="description" content="Cyberspace is the digital fabric of reality. Encrypt data to a location, build your digital world, find hidden treasures and visit real places on Earth." />

    <!--
      The link preview. og:image has to be absolute, so it names the production
      host: a preview deployment therefore shows production's card, which is
      the right trade, because a relative URL shows no card anywhere. The card
      itself is generated from tools/og-card.html. Versioned: previews are
      cached by the image's address, so a new card needs a new one (2: the
      ™ on the wordmark, 2026-10-21).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.onosendai.tech/" />
    <meta property="og:site_name" content="ONOSENDAI" />
    <meta property="og:title" content="ONOSENDAI" />
    <meta property="og:description" content="Cyberspace is the digital fabric of reality. Encrypt data to a location, build your digital world, find hidden treasures and visit real places on Earth." />
    <meta property="og:image" content="https://www.onosendai.tech/og.png?v=3" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The ONOSENDAI wordmark and its yellow mark beside a scene from the app: the violet ring of the Black Sun, a cyan hyperjump beam with an avatar inside it, and a neon structure beyond." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- X reads these first; kept equal to the og: tags (src/lib/routeCard.ts swaps both). -->
    <meta name="twitter:title" content="ONOSENDAI" />
    <meta name="twitter:description" content="Cyberspace is the digital fabric of reality. Encrypt data to a location, build your digital world, find hidden treasures and visit real places on Earth." />
    <meta name="twitter:image" content="https://www.onosendai.tech/og.png?v=3" />
    <meta name="twitter:image:alt" content="The ONOSENDAI wordmark and its yellow mark beside a scene from the app: the violet ring of the Black Sun, a cyan hyperjump beam with an avatar inside it, and a neon structure beyond." />
    
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=1">
    <link rel="manifest" href="/site.webmanifest?v=1">
    <link rel="mask-icon" href="/safari-pinned-tab.svg?v=1" color="#000000">
    <link rel="shortcut icon" href="/favicon.ico?v=1">
    <!-- The menu logo, warmed before the menu first opens so it never pops
         in and shifts the panel layout. -->
    <link rel="preload" as="image" href="/logo.png">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="theme-color" content="#000000">
    
    <!-- The preflight: whether this browser can run the app, in plain ES5 (src/lib/preflight.ts says why). -->
    <script id="preflight">
      (function () {
        var w = window, d = document;
        var lacks = [];
        if (!w.WebGL2RenderingContext) lacks.push('3D graphics (WebGL 2)');
        var ap = Array.prototype;
        if (typeof Object.hasOwn !== 'function' || typeof ap.at !== 'function' || typeof ap.findLast !== 'function' || typeof w.structuredClone !== 'function') lacks.push('a recent web engine (Safari 15.4 or newer)');
        var apple = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent);

        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        function show(title, lines, detail, reload) {
          var draw = function () {
            var root = d.getElementById('root');
            // Only over the wordmark: once the app has drawn (boot.tsx), it says what went wrong itself.
            if (!root || w.__onosendaiDrawn) return;
            var html = '<div class="cannot-run" role="alert"><img src="/logo.png" alt="ONOSENDAI" width="1969" height="354"><h1>' + esc(title) + '</h1>';
            for (var i = 0; i < lines.length; i++) html += '<p>' + esc(lines[i]) + '</p>';
            html += '<ul><li>iPhone or iPad: iOS or iPadOS 15.4 or newer. Every browser there runs on Safari, so the iOS version is what counts. Settings, General, Software Update.</li><li>Computer or Android: a current Chrome, Firefox, Edge or Safari.</li></ul>';
            if (detail) html += '<p class="cannot-run__detail">' + esc(detail) + '</p>';
            if (reload) html += '<button type="button" onclick="location.reload()">RELOAD</button>';
            root.innerHTML = html + '</div>';
          };
          if (d.getElementById('root')) draw(); else d.addEventListener('DOMContentLoaded', draw);
        }

        if (lacks.length) {
          w.__onosendaiUnsupported = lacks;
          var lines = ['This browser is missing ' + lacks.join(' and ') + '.'];
          if (apple && !w.WebGL2RenderingContext) lines.push('If Lockdown Mode is on, it turns 3D graphics off: exclude this site from it in Settings, Privacy & Security, Lockdown Mode.');
          show('ONOSENDAI can’t run in this browser', lines, navigator.userAgent, false);
          return;
        }

        var first = null;
        w.addEventListener('error', function (e) {
          if (first) return;
          var t = e && e.target;
          first = (e && (e.message || (e.error && e.error.message))) || (t && (t.src || t.href) ? 'could not load ' + (t.src || t.href) : null);
        }, true);
        w.onosendaiCannotStart = function (reason) {
          show('ONOSENDAI couldn’t start', ['Something stopped it loading. Try RELOAD. If it happens again, send the line below to the team.'], (reason || first || 'unknown') + ' | ' + navigator.userAgent, true);
        };
        w.addEventListener('load', function () {
          setTimeout(function () { if (!w.__onosendaiRan) w.onosendaiCannotStart(first || 'its first script never ran'); }, 3000);
        });
      })();
    </script>
    <style>
      .cannot-run { box-sizing: border-box; min-height: 100vh; max-width: 560px; margin: 0 auto; padding: 48px 20px; color: #fff; font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace; }
      .cannot-run img { display: block; width: 220px; max-width: 60vw; height: auto; margin-bottom: 28px; }
      .cannot-run h1 { margin: 0 0 14px; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
      .cannot-run p { margin: 0 0 12px; }
      .cannot-run ul { margin: 0 0 16px; padding-left: 20px; }
      .cannot-run li { margin-bottom: 8px; }
      .cannot-run__detail { color: rgba(255, 255, 255, 0.5); font-size: 12px; word-break: break-word; }
      .cannot-run button { margin-top: 8px; padding: 10px 22px; color: #000; background: #fff; border: 0; font: inherit; letter-spacing: 0.1em; cursor: pointer; -webkit-clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
    </style>

    <!-- Unregister any existing service workers -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </head>
  <body>
    <!--
      The first paint: the wordmark on black, drawn by the browser from this
      page alone, before any script runs or any database answers. It sits in
      #root, so the app's first render takes its place (src/boot.tsx). Inline
      and tiny on purpose: nothing here waits on the network but the logo,
      which is preloaded above, and the page is black without it.
    -->
    <style>
      html { background: #000; }
      .boot-shell { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #000; }
      .boot-shell img { width: min(56vw, 300px); height: auto; aspect-ratio: 1969 / 354; opacity: 0.92; }
      .boot-shell i { position: relative; display: block; width: 132px; height: 2px; overflow: hidden; background: rgba(255, 255, 255, 0.14); clip-path: polygon(2px 0, 100% 0, calc(100% - 2px) 100%, 0 100%); }
      .boot-shell i::after { content: ''; position: absolute; inset: 0; width: 40%; background: #fff; animation: boot-shell-run 1.4s ease-in-out infinite; }
      @keyframes boot-shell-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-shell i::after { animation: none; width: 100%; opacity: 0.4; } }
    </style>
    <div id="root"><div class="boot-shell" aria-label="ONOSENDAI is loading"><img src="/logo.png" alt="ONOSENDAI" width="1969" height="354" decoding="async"><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
