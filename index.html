<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Same-origin requests (the analytics collector among them) carry only the origin, never /C/<hex> or the query (src/lib/analytics.ts). -->
    <meta name="referrer" content="strict-origin" />
    
    <!-- No cache-busting meta tags here: Vercel already serves this page with
         Cache-Control: max-age=0, must-revalidate (and the build's assets are
         hashed), so a new build always loads. The old no-store / Expires 0 tags
         are the one thing this page had that cards X does show (fanfares.io)
         do not, while X showed no card for any onosendai.tech link (2026-11-13). -->
    
    <title>ONOSENDAI V2 — Cyberspace Explorer</title>
    <meta name="description" content="Cyberspace is the digital fabric of reality. Encrypt data to a location, build your digital world, find hidden treasures and visit real places on Earth." />

    <!--
      The link preview. og:image has to be absolute, so it names the production
      host: a preview deployment therefore shows production's card, which is
      the right trade, because a relative URL shows no card anywhere. The card
      itself is generated from tools/og-card.html. Versioned: previews are
      cached by the image's address, so a new card needs a new one (2: the
      ™ on the wordmark, 2026-10-21).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.onosendai.tech/" />
    <meta property="og:site_name" content="ONOSENDAI" />
    <meta property="og:title" content="ONOSENDAI" />
    <meta property="og:description" content="Cyberspace is the digital fabric of reality. Encrypt data to a location, build your digital world, find hidden treasures and visit real places on Earth." />
    <meta property="og:image" content="https://www.onosendai.tech/og.png?v=3" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The ONOSENDAI wordmark and its yellow mark beside a scene from the app: the violet ring of the Black Sun, a cyan hyperjump beam with an avatar inside it, and a neon structure beyond." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- X reads these first; kept equal to the og: tags (src/lib/routeCard.ts swaps both). -->
    <meta name="twitter:title" content="ONOSENDAI" />
    <meta name="twitter:description" content="Cyberspace is the digital fabric of reality. Encrypt data to a location, build your digital world, find hidden treasures and visit real places on Earth." />
    <meta name="twitter:image" content="https://www.onosendai.tech/og.png?v=3" />
    <meta name="twitter:image:alt" content="The ONOSENDAI wordmark and its yellow mark beside a scene from the app: the violet ring of the Black Sun, a cyan hyperjump beam with an avatar inside it, and a neon structure beyond." />
    
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=1">
    <link rel="manifest" href="/site.webmanifest?v=1">
    <link rel="mask-icon" href="/safari-pinned-tab.svg?v=1" color="#000000">
    <link rel="shortcut icon" href="/favicon.ico?v=1">
    <!-- The menu logo, warmed before the menu first opens so it never pops
         in and shifts the panel layout. -->
    <link rel="preload" as="image" href="/logo.png">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="theme-color" content="#000000">
    
    <!-- Unregister any existing service workers -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
